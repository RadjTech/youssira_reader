name: youssira_reader
description: "Youssira Reader — lecture PDF + traduction 100% on-device par superposition."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # --- PDF : rendu + extraction de texte avec coordonnées (PDFium) ---
  pdfrx: ^2.4.7

  # --- MuPDF (AGPL) : extraction structurée riche (police/taille/gras/
  # italique réels). L'app est publiée en open source sous AGPLv3. ---
  mupdf_extractor:
    path: packages/mupdf_extractor

  # --- PDFium FFI : style réel du texte (taille, graisse, couleur) ---
  # Appelle le même libpdfium.so déjà chargé par pdfrx : zéro poids APK,
  # licence BSD, 100 % hors-ligne.
  pdfium_flutter: ^0.2.3
  ffi: ^2.1.0

  # --- Génération de PDF (export du document traduit) ---
  pdf: ^3.11.1

  # --- Traduction on-device, mode léger (ML Kit Translation) ---
  google_mlkit_translation: ^0.15.1

  # --- Détection automatique de la langue du document ---
  google_mlkit_language_id: ^0.15.1

  # --- OCR on-device pour PDF scannés (ML Kit Text Recognition v2) ---
  google_mlkit_text_recognition: ^0.17.1

  # --- Monétisation : AdMob (interstitiel + récompensé, consentement UMP) ---
  # Série 7.x : build Gradle 8.11+/AGP 9 compatible ; API UMP
  # (ConsentInformation/ConsentForm) identique à la 5.x.
  google_mobile_ads: ^7.0.0

  # --- Achats intégrés Google Play (version Pro) ---
  in_app_purchase: ^3.3.0

  # --- Documents Word (.docx = ZIP + XML) : parseur/écrivain IR ---
  # archive ^4 imposé par la chaîne pdfrx → image ^4.8 → archive ^4.0.7.
  archive: ^4.0.9
  xml: ^6.5.0

  # --- Cache des traductions ---
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24

  # --- Utilitaires ---
  provider: ^6.1.2
  file_picker: ^12.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Génération de code pour drift
  drift_dev: ^2.20.2
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  # Polices ouvertes (SIL OFL, Google Noto) pour un calque fidèle à la
  # famille d'origine du document : Noto Serif pour les polices à empatte-
  # ments, Noto Sans Mono pour les polices à chasse fixe. La famille sans
  # reste la police système (Roboto).
  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSerif-Italic.ttf
          style: italic
        - asset: assets/fonts/NotoSerif-BoldItalic.ttf
          weight: 700
          style: italic
    - family: NotoSansMono
      fonts:
        - asset: assets/fonts/NotoSansMono-Regular.ttf
        - asset: assets/fonts/NotoSansMono-Bold.ttf
          weight: 700
